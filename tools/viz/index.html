<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c"></canvas><canvas id="out"></canvas>
<script type="importmap">{"imports":{"three":"/static/js/vendor/three.module.min.js"}}</script>
<script type="module">
// Vizualizace exteriéru (podklad pro img2img): maketa z projektové dokumentace s materiály a světlem zlaté hodiny.
import { vytvorMaketu } from '../../static/js/model.js';
import * as THREE from 'three';
import { EffectComposer } from './jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './jsm/postprocessing/RenderPass.js';
import { GTAOPass } from './jsm/postprocessing/GTAOPass.js';
import { OutputPass } from './jsm/postprocessing/OutputPass.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1600, H = +q.get('h') || 900, S = +q.get('s') || 24;
const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
window.devicePixelRatio = 1;
const m = vytvorMaketu(c, { kvalita: 'offline', preserve: true, bezAnimace: true, pevnaVelikost: true, maxDpr: 1, fov: +q.get('fov') || 32, expozice: +q.get('ex') || 1.0, env: 0.25, hemi: 0.0, slunce: 0, stromy: q.get('stromy') !== '0' });
m.setSize(W, H);
m.nastavRezim('dum');
const T = THREE, sc = m.scene;
const hexOf = (mat) => mat && mat.color ? mat.color.getHex() : -1;
const MS = (c, r, met = 0, extra = {}) => new T.MeshStandardMaterial({ color: c, roughness: r, metalness: met, ...extra });
const mats = {
  fasada: MS(0xf1ebe1, 0.85), sokl: MS(0x77726b, 0.9), strecha: MS(0x3b3b3d, 0.55, 0.3), beton: MS(0xd9d3c9, 0.85),
  dub: MS(0x9b6a3a, 0.55), kov: MS(0x1d1c1b, 0.45, 0.6), sklo: MS(0x2a2e33, 0.04, 0.0, { envMapIntensity: 2.2 }),
  travnik: MS(0x6b8a3e, 1), plot: MS(0x3f5c2a, 1), dlazba: MS(0xc9bba6, 0.9), koruna: MS(0x5b7a37, 1), kmen: MS(0x5b4836, 1),
};
const vStrese = new Set(); m.strechaG.traverse(o => vStrese.add(o));
const okenni = new Set();
sc.traverse(o => {
  if (!(o.isMesh || o.isInstancedMesh)) return;
  const mat = Array.isArray(o.material) ? o.material[0] : o.material;
  if (o.material && o.material.isShadowMaterial) { o.visible = false; return; }
  if (Array.isArray(o.material)) { o.visible = false; return; }     // modelová deska
  const h = hexOf(mat);
  const clip = mat.clippingPlanes && mat.clippingPlanes.length;
  if (vStrese.has(o)) { o.material = h === 0x4d4943 ? mats.sklo : mats.strecha; return; }
  if (h === 0xf4f1ec) o.material = mats.fasada;
  else if (h === 0xd9d0c2) o.material = mats.sokl;
  else if (h === 0xe9e5de) o.material = mats.beton;
  else if (h === 0x2b2724) o.material = clip ? mats.dub : mats.kov;
  else if (h === 0x4f4b46) { o.material = mats.sklo; o.material.side = T.DoubleSide; }
  else if (h === 0xe2e0d0) o.material = mats.travnik;
  else if (h === 0xcfcdb9) o.material = mats.plot;
  else if (h === 0xf1ece3) o.material = mats.dlazba;
  else if (h === 0xeeebe4) o.material = mats.koruna;
  else if (h === 0xcdbfa9) o.material = mats.kmen;
});
// vyšší živé ploty
sc.traverse(o => { if (o.isMesh && o.material === mats.plot) { o.geometry.computeBoundingBox(); const b = o.geometry.boundingBox;
  const g2 = new T.BoxGeometry(Math.max(b.max.x - b.min.x, 0.5), 1.05, Math.max(b.max.z - b.min.z, 0.5)); g2.translate((b.min.x + b.max.x) / 2, -0.31 + 0.525, (b.min.z + b.max.z) / 2); o.geometry = g2; } });
// stromořadí za domem a po stranách (pozadí)
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
if (q.get('pozadi') !== '0') for (let i = 0; i < 46; i++) { const x = -90 + i * 4 + rnd() * 3, z = -42 - rnd() * 22, r = 2.4 + rnd() * 2.0, h = 2.5 + rnd() * 3;
  const k = new T.Mesh(new T.IcosahedronGeometry(r, 3).scale(1, 1.3, 1), mats.koruna); k.position.set(x, h + r, z); k.castShadow = true; k.receiveShadow = true; sc.add(k); }
if (q.get('boky') !== '0') for (const [x, z, r] of [[-38, 4, 2.6], [-41, 12, 3.2], [36, 6, 2.8], [40, -6, 3.4], [-36, -8, 3]]) {
  const k = new T.Mesh(new T.IcosahedronGeometry(r, 3).scale(1, 1.25, 1), mats.koruna); k.position.set(x, 2.6 + r, z); k.castShadow = true; sc.add(k);
  const t = new T.Mesh(new T.CylinderGeometry(0.12, 0.16, 3.2, 8), mats.kmen); t.position.set(x, 1.3, z); t.castShadow = true; sc.add(t); }
// zem kolem
const zem = new T.Mesh(new T.PlaneGeometry(900, 900).rotateX(-Math.PI / 2), MS(0x6f8840, 1));
zem.position.y = -0.33; zem.receiveShadow = true; sc.add(zem);
const cesta = new T.Mesh(new T.PlaneGeometry(70, 5).rotateX(-Math.PI / 2), MS(0x8d877e, 0.95));
cesta.position.set(0, -0.32, -16); cesta.receiveShadow = true; sc.add(cesta);
// obloha zlaté hodiny
const cv = document.createElement('canvas'); cv.width = 4; cv.height = 512; const g = cv.getContext('2d');
const gr = g.createLinearGradient(0, 0, 0, 512);
gr.addColorStop(0, '#7f9bb8'); gr.addColorStop(0.45, '#c9c3bb'); gr.addColorStop(0.72, '#f2c99a'); gr.addColorStop(1, '#f7d7ae');
g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace;
sc.background = tex;
sc.fog = new T.Fog(0xf0caa0, 60, 260);
// světlo
const hemi = new T.HemisphereLight(0xbfd0e6, 0x6d5a3e, 0.55); sc.add(hemi);
m.slunce.color.set(0xffb878); m.slunce.intensity = +q.get("si") || 7;
const sun = (q.get('sun') || '-70,13,30').split(',').map(Number);
m.slunce.position.set(...sun);
const shc = m.slunce.shadow.camera; shc.left = -60; shc.right = 60; shc.top = 50; shc.bottom = -50; shc.far = 300; shc.updateProjectionMatrix();
m.renderer.toneMapping = T.NeutralToneMapping; m.renderer.toneMappingExposure = +q.get('ex') || 1.0;
const pos = (q.get('pos') || '-34,2,34').split(',').map(Number), tgt = (q.get('t') || '0,3,4').split(',').map(Number);
m.kamera(pos, tgt);
const base = m.slunce.position.clone();
const comp = new EffectComposer(m.renderer); comp.setSize(W, H);
comp.addPass(new RenderPass(sc, m.camera));
const ao = new GTAOPass(sc, m.camera, W, H);
ao.updateGtaoMaterial({ radius: 0.8, distanceExponent: 1.5, thickness: 2, scale: 1, samples: 16 });
ao.blendIntensity = 0.8; comp.addPass(ao); comp.addPass(new OutputPass());
const out = document.getElementById('out'); out.width = W; out.height = H; const ctx = out.getContext('2d');
await new Promise(r => setTimeout(r, 50));
for (let i = 0; i < S; i++) {
  const a = i * 2.39996, r = Math.sqrt((i + 0.5) / S) * 1.6;
  m.slunce.position.set(base.x + Math.cos(a) * r, base.y + Math.sin(a) * r * 0.5, base.z + Math.sin(a) * r);
  m.slunce.shadow.needsUpdate = true;
  comp.render();
  ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(c, 0, 0);
}
c.style.display = 'none';
document.title = 'hotovo';
</script></body></html>
