{# Kontaktní formulář. Endpoint a demo režim z _data/site.json (formular.endpoint, formular.demo). #}
<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <label class="pole">Jméno a příjmení <input name="jmeno" autocomplete="name" required></label>
  <div class="pole-2">
    <label class="pole">E-mail <input name="email" type="email" autocomplete="email" required></label>
    <label class="pole">Telefon <input name="telefon" type="tel" autocomplete="tel"></label>
  </div>
  <label class="pole">Mám zájem o
    <select name="byt">
      <option value="">Zatím nevím, chci poradit</option>
      {% for d in data.byty.domy %}<optgroup label="{{ d.nazev }}">{% for b in d.byty %}<option value="Byt {{ b.kod }}">Byt {{ b.kod }} · {{ b.patro_text }} · {{ b.venku_typ }} {{ m2(b.venku) }} m² · {{ b.cena_text }}</option>{% endfor %}</optgroup>{% endfor %}
    </select>
  </label>
  <label class="pole">Zpráva <textarea name="zprava" rows="4" placeholder="Kdy se vám hodí prohlídka?"></textarea></label>
  <div class="past" aria-hidden="true"><label>Nevyplňovat <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <button type="submit" class="btn">Odeslat</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
