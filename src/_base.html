<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulek or site.nazev }}</title>
<meta name="description" content="{{ popis or site.popis }}">
{% if site.navrh or noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<meta name="theme-color" content="{{ site.theme_color }}">
<link rel="canonical" href="{{ site.url }}{{ cesta or '' }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="cs_CZ">
<meta property="og:title" content="{{ titulek or site.nazev }}">
<meta property="og:description" content="{{ popis or site.popis }}">
<meta property="og:url" content="{{ site.url }}{{ cesta or '' }}">
{% if og_url %}<meta property="og:image" content="{{ og_url }}">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">{% endif %}
<link rel="preload" href="{{ base }}fonts/gildadisplay-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ asset('css/fonts.css') }}">
<link rel="stylesheet" href="{{ asset('css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B4935E'/%3E%3C/svg%3E">
{% block head %}{% endblock %}
{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}
</head>
<body>
<a class="skip" href="#obsah">Přeskočit na obsah</a>
<header class="hlavicka">
  <div class="wrap">
    <a href="{{ url('') }}" class="znacka" aria-label="Rezidence Metelka – úvod"><b>REZIDENCE METELKA</b><small>Hradec Králové</small></a>
    <nav class="menu" id="menu" aria-label="Hlavní">
      {% for n in site.nav %}<a href="{{ n.href }}"{% if n.text == 'Ceník' %} class="btn"{% endif %}>{{ n.text }}</a>{% endfor %}
    </nav>
    <button class="burger" aria-expanded="false" aria-controls="menu" aria-label="Menu"><span></span></button>
  </div>
</header>
<main id="obsah">
{% block obsah %}{% endblock %}
</main>
<script src="{{ asset('js/main.js') }}" defer></script>
</body>
</html>
